[project]
name = "forager-knowledge-mcp"
version = "1.0.0"
description = "MCP server for searching and retrieving forager project knowledge"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
