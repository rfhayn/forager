<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forager — Color Option Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, 'SF Pro Text', sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    padding: 32px 24px 80px;
  }
  h1 {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: #fff;
  }
  .page-subtitle {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-bottom: 40px;
  }

  /* Option section */
  .option-section {
    margin-bottom: 56px;
  }
  .option-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 6px;
  }
  .option-title {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  .option-badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 10px;
    background: #2D5016;
    color: #7BC08A;
  }
  .option-badge.current {
    background: #333;
    color: #aaa;
  }
  .option-subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
  }

  /* Mode row */
  .mode-row {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .mode-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .mode-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #888;
    margin-bottom: 12px;
  }

  /* Phone frame */
  .phone-scroll {
    width: 390px;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 40px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .phone-scroll::-webkit-scrollbar { display: none; }
  .phone-strip {
    display: flex;
    width: max-content;
  }
  .phone-frame {
    width: 390px;
    min-width: 390px;
    height: 780px;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    scroll-snap-align: start;
    flex-shrink: 0;
  }
  .phone-content {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 56px 16px 32px;
  }
  .phone-content::-webkit-scrollbar { display: none; }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px 0;
    font-size: 14px;
    font-weight: 600;
    z-index: 10;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 4px; font-size: 12px; }

  /* Tab bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 82px;
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 10px;
    font-size: 10px;
    font-weight: 500;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid;
    z-index: 10;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .tab-icon { font-size: 22px; }

  /* View indicator dots */
  .view-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
  }
  .view-dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: #555;
  }

  /* Shared component styles */
  .card {
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .ghost-card {
    border: 2px dashed;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    background: transparent !important;
  }
  .section-title {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .greeting {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .subtitle {
    font-size: 14px;
    margin-bottom: 16px;
  }
  .card-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .card-title {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-detail {
    font-size: 13px;
  }

  /* Progress ring */
  .progress-ring {
    width: 44px;
    height: 44px;
  }
  .progress-ring circle {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
  }

  /* Day circles */
  .day-circles {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .day-circle {
    width: 28px;
    height: 28px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    border: 1.5px solid;
  }
  .day-circle.filled {
    border-color: transparent;
  }

  /* Filter pills */
  .filter-pills {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .filter-pill {
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
  }

  /* Recipe grid */
  .recipe-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .recipe-card {
    border-radius: 14px;
    overflow: hidden;
  }
  .recipe-photo {
    width: 100%;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .recipe-info {
    padding: 10px 12px;
  }
  .recipe-name {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .recipe-time {
    font-size: 12px;
  }

  /* Grocery list */
  .grocery-section {
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .grocery-header {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }
  .grocery-item {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 0.5px solid;
  }
  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 11px;
    border: 2px solid;
    flex-shrink: 0;
  }
  .item-text {
    flex: 1;
  }
  .item-name {
    font-size: 15px;
  }
  .item-source {
    font-size: 12px;
    margin-top: 1px;
  }

  /* Quick actions */
  .quick-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .quick-btn {
    flex: 1;
    padding: 10px 4px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }

  /* Meal plan card */
  .meal-plan-card {
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .plan-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .plan-name {
    font-family: -apple-system, system-ui, 'SF Pro Rounded', 'SF Pro Display', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .plan-date {
    font-size: 13px;
    margin-bottom: 10px;
  }
  .gen-btn {
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }

  /* Swipe hint */
  .swipe-hint {
    text-align: center;
    font-size: 11px;
    color: #666;
    margin-top: 6px;
  }
</style>
</head>

function progressRingSVG(c, pct) {
  const r = 18, circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct);
  return `<svg class="progress-ring" viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="${r}" stroke="${c.borderSubtle}" />
    <circle cx="22" cy="22" r="${r}" stroke="${c.accentPri}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 22 22)" />
    <text x="22" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="${c.textPri}">${Math.round(pct*100)}%</text>
  </svg>`;
}

function dayCirclesHTML(c, filled) {
  const days = ['S','M','T','W','T','F','S'];
  return `<div class="day-circles">${days.map((d, i) => {
    const isFilled = filled.includes(i);
    return `<div class="day-circle${isFilled ? ' filled' : ''}" style="
      background:${isFilled ? c.accentPri : 'transparent'};
      border-color:${isFilled ? c.accentPri : c.borderSubtle};
      color:${isFilled ? '#fff' : c.textTer};
    ">${d}</div>`;
  }).join('')}</div>`;
}

    <div class="card" style="background:${c.surfPrimary}; display:flex; align-items:center; gap:14px;">

        <div class="card-title" style="color:${c.textPri}">Weekly Groceries</div>
        <div class="card-detail" style="color:${c.textSec}">5 of 16 items checked</div>
      </div>
      ${progressRingSVG(c, 0.31)}
    </div>

    <div class="card" style="background:${c.surfPrimary};">
      <div class="card-label" style="color:${c.textTer}">Meal Plan</div>

      ${dayCirclesHTML(c, [0,1,2,3])}

      <div class="quick-btn" style="background:${c.surfPrimary}; color:${c.accentPri}; border:1px solid ${c.borderSubtle};">Plan Meals</div>
    </div>`;
}

function renderPhone(c, viewFn, bgCanvas, tabBarBg, tabBarBorder, statusColor) {
  const content = viewFn(c);
  return `
    <div class="phone-frame" style="background:${bgCanvas};">
      <div class="status-bar" style="color:${statusColor};">
        <span class="time">9:41</span>
        <div class="status-icons">
          <span>\u25CF\u25CF\u25CF\u25CF</span>
          <span>WiFi</span>
          <span>\uD83D\uDD0B</span>
        </div>
      </div>
      <div class="phone-content">${content}</div>
      <div class="tab-bar" style="background:${tabBarBg}; border-color:${tabBarBorder}; color:${c.textTer};">
        <div class="tab-item" style="color:${c.accentPri}"><span class="tab-icon">\uD83C\uDFE0</span>Home</div>
        <div class="tab-item"><span class="tab-icon">\uD83D\uDED2</span>Lists</div>
        <div class="tab-item"><span class="tab-icon">\uD83D\uDCD6</span>Recipes</div>
        <div class="tab-item"><span class="tab-icon">\uD83D\uDCC5</span>Plans</div>
      </div>
    </div>`;
}

function buildOption(opt) {
  const views = [renderDashboard, renderGroceryList, renderRecipeGrid, renderMealPlans];
  const viewNames = ['Dashboard', 'Grocery List', 'Recipes', 'Meal Plans'];

  function phoneSet(c, isDark) {
    const bgCanvas = c.bgCanvas;
    const tabBarBg = isDark ? c.surfPrimary + 'ee' : c.surfPrimary + 'dd';
    const tabBarBorder = c.borderSubtle;
    const statusColor = c.textPri;
    return `<div class="mode-col">
      <div class="mode-label">${isDark ? 'Dark' : 'Light'}</div>
      <div class="phone-scroll">
        <div class="phone-strip">
          ${views.map(fn => renderPhone(c, fn, bgCanvas, tabBarBg, tabBarBorder, statusColor)).join('')}
        </div>
      </div>
      <div class="view-dots">
        ${viewNames.map(() => '<div class="view-dot"></div>').join('')}
      </div>
      <div class="swipe-hint">Swipe to see all views</div>
    </div>`;
  }

  const badgeHTML = opt.badge ? `<span class="option-badge ${opt.badgeClass}">${opt.badge}</span>` : '';

  return `
    <div class="option-section" id="${opt.id}">
      <div class="option-header">
        <span class="option-title">${opt.name}</span>
        ${badgeHTML}
      </div>
      <p class="option-subtitle">${opt.subtitle}</p>
      <div class="mode-row">
        ${phoneSet(opt.light, false)}
        ${phoneSet(opt.dark, true)}
      </div>
    </div>`;
}

// Render all options
document.addEventListener('DOMContentLoaded', () => {
  const container = document.createElement('div');
  OPTIONS.forEach(opt => {
    container.innerHTML += buildOption(opt);
  });
  document.body.appendChild(container);

  // Update scroll indicator dots
  document.querySelectorAll('.phone-scroll').forEach(scroll => {
    const dots = scroll.parentElement.querySelectorAll('.view-dot');
    if (dots.length) dots[0].style.background = '#aaa';

    scroll.addEventListener('scroll', () => {
      const idx = Math.round(scroll.scrollLeft / 390);
      dots.forEach((d, i) => {
        d.style.background = i === idx ? '#aaa' : '#555';
      });
    });
  });
});
</script>

</body>
</html>
